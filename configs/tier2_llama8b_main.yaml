# Tier 2 Conference Main Config: Llama-3.1-8B-Instruct
# Full conference experiment configuration for A100/H100 GPUs

model:
  name_or_path: "meta-llama/Llama-3.1-8B-Instruct"
  num_experts: 8
  rank: 8
  alpha: 16.0
  router_temp: 1.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "up_proj", "down_proj"]
  ttt_layer_indices: "upper_half"

stage1:
  lr_experts: 2.0e-4
  lr_router: 5.0e-4
  weight_decay: 0.01
  total_steps: 3000
  warmup_steps: 300
  batch_size: 32
  max_length: 512
  lambda_bal: 0.01
  lambda_z: 1.0e-3
  lambda_ortho: 0.05
  temp_start: 1.5
  temp_end: 0.7
  logging_steps: 50
  save_steps: 500
  output_dir: "checkpoints/tier2/stage1"

surgery:
  freeze_static_experts: true
  scratchpad_bias_init: -2.0
  output_dir: "checkpoints/tier2/stage2_init"

stage2:
  inner_steps: 3
  meta_lr_gate: 2.0e-4
  meta_lr_scratchpad: 2.0e-4
  meta_lr_eta: 1.0e-3
  gamma_kl: 0.1
  gamma_ortho: 0.05
  lambda_kl: 0.1
  meta_batch_size: 4
  total_episodes: 2000
  max_length: 512
  logging_episodes: 20
  save_episodes: 200
  output_dir: "checkpoints/tier2/stage2"

inference:
  inner_steps: 3
  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
